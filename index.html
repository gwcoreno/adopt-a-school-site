const FUNDED = "#58C5CC";
const UNFUNDED = "#B1B4B8";

function escape(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;",
  })[c]);
}

const map = L.map("map");
L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
  attribution: "&copy; OpenStreetMap contributors &copy; CARTO",
  subdomains: "abcd",
  maxZoom: 19,
}).addTo(map);

const bounds = [];

schools.forEach(s => {
  const color = s.status === "Funded" ? FUNDED : UNFUNDED;
  const marker = L.circleMarker([s.lat, s.lng], {
    radius: 7,
    fillColor: color,
    color: "white",
    weight: 2,
    opacity: 1,
    fillOpacity: 0.9,
    dashArray: s.approximate ? "2,3" : null,
  });
  const approxNote = s.approximate
    ? `<div class="popup-approx">Approximate location (ZIP centroid)</div>`
    : "";
  marker.bindPopup(`
    <div class="popup-name">${escape(s.name)}</div>
    <div class="popup-address">${escape(s.address)}</div>
    <div class="popup-status status-${s.status.toLowerCase()}">${escape(s.status)}</div>
    ${approxNote}
  `);
  marker.addTo(map);
  bounds.push([s.lat, s.lng]);
});

if (bounds.length > 0) {
  map.fitBounds(bounds, {
    padding: [10, 10],
    maxZoom: 13,
  });
} else {
  map.setView([30.27, -97.74], 10);
}

const legend = L.control({ position: "bottomright" });
legend.onAdd = function () {
  const div = L.DomUtil.create("div", "legend");
  div.innerHTML = `
    <div><span class="legend-dot" style="background:${FUNDED}"></span>Adopted</div>
    <div><span class="legend-dot" style="background:${UNFUNDED}"></span>Still Waiting</div>
  `;
  return div;
};
legend.addTo(map);
